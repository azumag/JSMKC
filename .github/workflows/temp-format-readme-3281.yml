name: Temporary format README for PR 3281

on:
  push:
    branches:
      - docs/cloudflare-preview-readme-3279

permissions:
  contents: write

jobs:
  format-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/cloudflare-preview-readme-3279
      - name: Format README with repository Prettier version
        working-directory: smkc-score-app
        run: npx --yes prettier@3.9.5 --write README.md
      - name: Commit formatted README when needed
        run: |
          if git diff --quiet -- smkc-score-app/README.md; then
            echo "README is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smkc-score-app/README.md
          git commit -m "docs: format Cloudflare README workflow section"
          git push origin HEAD:docs/cloudflare-preview-readme-3279
