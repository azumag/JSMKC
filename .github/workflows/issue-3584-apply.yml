name: Apply issue 3584 implementation

on:
  push:
    branches:
      - fix/3584-qualification-bracket-network-errors

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: fix/3584-qualification-bracket-network-errors
          fetch-depth: 0

      - name: Apply network-error handling, tests, and docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('smkc-score-app')
          contracts = {
              'bm': 'alert',
              'mr': 'toast.error',
              'gp': 'alert',
          }

          for mode, notifier in contracts.items():
              path = root / 'src' / 'app' / 'tournaments' / '[id]' / mode / 'page-client.tsx'
              source = path.read_text()

              old_reset = """                  setFinalsExists(false);\n                } finally {\n                  setResettingBracket(false);\n"""
              new_reset = f"""                  setFinalsExists(false);\n                }} catch (error) {{\n                  logger.error('Failed to reset qualification bracket', {{ error, tournamentId }});\n                  {notifier}(tc('networkError'));\n                }} finally {{\n                  setResettingBracket(false);\n"""
              if source.count(old_reset) != 1:
                  raise SystemExit(f'{mode}: reset bracket insertion point not found exactly once')
              source = source.replace(old_reset, new_reset, 1)

              old_generate = """                  setFinalsExists(true);\n                } finally {\n                  setGeneratingBracket(false);\n"""
              new_generate = f"""                  setFinalsExists(true);\n                }} catch (error) {{\n                  logger.error('Failed to generate qualification bracket', {{ error, tournamentId }});\n                  {notifier}(tc('networkError'));\n                }} finally {{\n                  setGeneratingBracket(false);\n"""
              if source.count(old_generate) != 1:
                  raise SystemExit(f'{mode}: generate bracket insertion point not found exactly once')
              source = source.replace(old_generate, new_generate, 1)
              path.write_text(source)

          test_path = root / '__tests__' / 'static' / 'qualification-bracket-error-fallbacks.test.ts'
          test_path.write_text("""import fs from 'fs';
          import path from 'path';

          const pageContracts = [
            { mode: 'bm', notifier: 'alert' },
            { mode: 'mr', notifier: 'toast.error' },
            { mode: 'gp', notifier: 'alert' },
          ] as const;

          function readAppFile(...parts: string[]) {
            return fs.readFileSync(path.join(process.cwd(), ...parts), 'utf8');
          }

          describe('qualification bracket network error contract (issue #3584)', () => {
            it.each(pageContracts)(
              '$mode preserves API errors and surfaces fetch rejection with common.networkError',
              ({ mode, notifier }) => {
                const source = readAppFile('src', 'app', 'tournaments', '[id]', mode, 'page-client.tsx');

                expect(source).toContain(`${notifier}(err.error || tc('failedResetBracket'));`);
                expect(source).toContain(`${notifier}(err.error || tc('failedGenerateBracket'));`);
                expect(source).toContain(
                  `logger.error('Failed to reset qualification bracket', { error, tournamentId });\\n                  ${notifier}(tc('networkError'));`,
                );
                expect(source).toContain(
                  `logger.error('Failed to generate qualification bracket', { error, tournamentId });\\n                  ${notifier}(tc('networkError'));`,
                );
                expect(source).toContain('setResettingBracket(false);');
                expect(source).toContain('setGeneratingBracket(false);');
              },
            );
          });
          """)

          docs_path = root / 'docs' / 'qualification-bracket-error-feedback.md'
          docs_path.write_text("""# Qualification bracket error feedback contract

          BM / MR / GP qualification 画面の finals/playoff bracket の生成・リセットは、HTTP response と fetch/network rejection を区別して通知する。

          ## Error contract

          - non-2xx response が具体的な `error` を返した場合は、その API 固有メッセージを最優先する。
          - non-2xx response に具体的な `error` がない場合は、既存の `common.failedResetBracket` / `common.failedGenerateBracket` を使用する。
          - `fetch()` 自体が reject した場合は、共有翻訳キー `common.networkError` を使用する。
          - BM / GP は既存 UI に合わせて `alert()`、MR は `toast.error()` で通知する。
          - fetch rejection は client logger に action と `tournamentId` を残す。
          - 成功時だけ `setFinalsExists(false | true)` を更新し、失敗時には既存 bracket state を保持する。
          - `finally` で `resettingBracket` / `generatingBracket` を必ず解除する。

          ## 非変更事項

          finals API endpoint / payload、Top-16 / Top-24 判定、qualification scoring、確認ダイアログ、成功時の画面遷移契約は変更しない。
          """)

          Path('.github/workflows/issue-3584-apply.yml').unlink()
          PY

          git diff --check
          git status --short

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: surface qualification bracket network failures (#3584)"
          git push origin HEAD:fix/3584-qualification-bracket-network-errors
