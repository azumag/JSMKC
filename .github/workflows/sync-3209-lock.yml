name: Sync PR 3209 lockfile from main

on:
  push:
    branches:
      - feat/3054-decision-checklist
    paths:
      - .github/workflows/sync-3209-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sync package-lock.json from main
        run: |
          git fetch origin main
          git checkout origin/main -- smkc-score-app/package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add smkc-score-app/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already aligned with main.'
            exit 0
          fi
          git commit -m 'chore: align lockfile with main security refresh'
          git push origin HEAD:feat/3054-decision-checklist
