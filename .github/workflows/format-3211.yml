name: Format PR 3211 test

on:
  push:
    branches:
      - fix/3210-security-lock-refresh
    paths:
      - .github/workflows/format-3211.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smkc-score-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smkc-score-app/package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.4
      - name: Install dependencies
        run: npm ci
      - name: Format Miniflare compatibility test
        run: npx prettier --write __tests__/lib/d1-atomic-batch.test.ts
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add __tests__/lib/d1-atomic-batch.test.ts
          if git diff --cached --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git commit -m 'style: format Miniflare compatibility test'
          git push origin HEAD:fix/3210-security-lock-refresh
