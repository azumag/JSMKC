name: Apply issue 3586 review fix

on:
  push:
    branches:
      - fix/3586-overall-ranking-error-fallbacks

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: fix/3586-overall-ranking-error-fallbacks
          fetch-depth: 0
      - name: Normalize malformed JSON failures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('smkc-score-app')
          page = root / 'src' / 'app' / 'tournaments' / '[id]' / 'overall-ranking' / 'page.tsx'
          source = page.read_text()
          old = '\n'.join([
              '    const data = await response.json();',
              '    if (data.success && data.data) {',
              '      return data.data as OverallRankingData;',
              '    }',
              "    if (typeof data.error === 'string' && data.error.trim()) {",
              '      throw new Error(data.error);',
              '    }',
              "    logger.error('Overall ranking fetch returned an invalid response', { tournamentId });",
              '    throw new GenericOverallRankingError();',
          ])
          new = '\n'.join([
              '    let data: { success?: boolean; data?: OverallRankingData; error?: unknown };',
              '    try {',
              '      data = await response.json();',
              '    } catch (err) {',
              "      logger.error('Overall ranking fetch returned malformed JSON', { error: err, tournamentId });",
              '      throw new GenericOverallRankingError();',
              '    }',
              '    if (data.success && data.data) {',
              '      return data.data;',
              '    }',
              "    if (typeof data.error === 'string' && data.error.trim()) {",
              '      throw new Error(data.error);',
              '    }',
              "    logger.error('Overall ranking fetch returned an invalid response', { tournamentId });",
              '    throw new GenericOverallRankingError();',
          ])
          if old not in source:
              raise SystemExit('overall-ranking success response block not found')
          page.write_text(source.replace(old, new, 1))

          test = root / '__tests__' / 'static' / 'overall-ranking-error-fallbacks.test.ts'
          test_source = test.read_text()
          anchor = "    expect(source).toContain('pollError instanceof GenericOverallRankingError');\n"
          addition = '\n'.join([
              "    expect(source).toContain(\"logger.error('Overall ranking fetch returned malformed JSON', { error: err, tournamentId });\");",
              "    expect(source).toContain('throw new GenericOverallRankingError();');",
              '',
          ])
          if anchor not in test_source:
              raise SystemExit('overall-ranking test insertion anchor not found')
          test.write_text(test_source.replace(anchor, anchor + addition, 1))

          Path('.github/workflows/issue-3586-followup.yml').unlink()
          PY
          git diff --check
      - name: Commit review fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize malformed overall ranking responses (#3586)"
          git push origin HEAD:fix/3586-overall-ranking-error-fallbacks
