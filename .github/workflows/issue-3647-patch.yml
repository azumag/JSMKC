name: Apply issue 3647 patch

on:
  push:
    branches:
      - fix/3647-shared-match-load-errors

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/3647-shared-match-load-errors
          fetch-depth: 1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: smkc-score-app/package-lock.json

      - name: Apply shared match load error changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          app = Path('smkc-score-app')

          helper = app / 'src/lib/shared-match-page-data.ts'
          helper.write_text(textwrap.dedent("""\
          import { createLogger } from '@/lib/client-logger';
          import { fetchWithRetry } from '@/lib/fetch-with-retry';

          const logger = createLogger({ serviceName: 'shared-match-page-data' });

          export type SharedMatchMode = 'BM' | 'MR' | 'GP';

          export class SharedMatchNotFoundError extends Error {
            constructor() {
              super('shared-match-not-found');
              this.name = 'SharedMatchNotFoundError';
            }
          }

          class SharedMatchLoadError extends Error {
            constructor() {
              super('shared-match-load-failed');
              this.name = 'SharedMatchLoadError';
            }
          }

          export function isSharedMatchNotFoundError(error: Error | null): boolean {
            return error instanceof SharedMatchNotFoundError;
          }

          export async function fetchSharedMatchPageData<TMatch, TTournament>({
            tournamentId,
            matchId,
            mode,
          }: {
            tournamentId: string;
            matchId: string;
            mode: SharedMatchMode;
          }): Promise<{ match: TMatch; tournament: TTournament }> {
            const modePath = mode.toLowerCase();

            try {
              const [matchResponse, tournamentResponse] = await Promise.all([
                fetch(`/api/tournaments/${tournamentId}/${modePath}/match/${matchId}`),
                fetchWithRetry(`/api/tournaments/${tournamentId}?fields=summary`),
              ]);

              if (matchResponse.status === 404 || tournamentResponse.status === 404) {
                throw new SharedMatchNotFoundError();
              }

              if (!matchResponse.ok || !tournamentResponse.ok) {
                logger.error('Shared match page fetch returned a generic error response', {
                  mode,
                  tournamentId,
                  matchId,
                  matchStatus: matchResponse.status,
                  tournamentStatus: tournamentResponse.status,
                });
                throw new SharedMatchLoadError();
              }

              const [matchJson, tournamentJson] = await Promise.all([matchResponse.json(), tournamentResponse.json()]);

              return {
                match: (matchJson.data ?? matchJson) as TMatch,
                tournament: (tournamentJson.data ?? tournamentJson) as TTournament,
              };
            } catch (error) {
              if (error instanceof SharedMatchNotFoundError || error instanceof SharedMatchLoadError) {
                throw error;
              }

              const metadata =
                error instanceof Error ? { message: error.message, stack: error.stack } : { error };
              logger.error('Failed to load shared match page data', {
                ...metadata,
                mode,
                tournamentId,
                matchId,
              });
              throw new SharedMatchLoadError();
            }
          }
          """))

          pages = [
              ('bm', 'BM', 'BMMatch', False),
              ('mr', 'MR', 'MRMatch', True),
              ('gp', 'GP', 'GPMatch', True),
          ]

          for slug, mode, match_type, has_common in pages:
              path = app / f'src/app/tournaments/[id]/{slug}/match/[matchId]/page.tsx'
              source = path.read_text()

              source = source.replace("import { fetchWithRetry } from '@/lib/fetch-with-retry';\n\n", '')
              helper_import = (
                  "import { fetchSharedMatchPageData, isSharedMatchNotFoundError } "
                  "from '@/lib/shared-match-page-data';\n"
              )
              if helper_import not in source:
                  use_client_end = source.index("'use client';") + len("'use client';")
                  source = source[:use_client_end] + '\n' + helper_import + source[use_client_end:]

              if not has_common:
                  needle = "  const tBm = useTranslations('bm');\n"
                  replacement = needle + "  const tCommon = useTranslations('common');\n"
                  if source.count(needle) != 1:
                      raise SystemExit(f'{path}: expected BM translation marker once')
                  source = source.replace(needle, replacement, 1)

              callback_pattern = re.compile(
                  r"  const fetchMatchData = useCallback\(async \(\) => \{.*?\n  \}, \[tournamentId, matchId\]\);",
                  re.S,
              )
              callback_replacement = textwrap.dedent(f"""\
                const fetchMatchData = useCallback(
                  () =>
                    fetchSharedMatchPageData<{match_type}, Tournament>({{
                      tournamentId,
                      matchId,
                      mode: '{mode}',
                    }}),
                  [tournamentId, matchId],
                );""")
              source, count = callback_pattern.subn(callback_replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: expected fetchMatchData callback once, got {count}')

              polling_match = re.search(
                  r"  const \{\n(?P<body>.*?)\n  \} = usePolling\(fetchMatchData, \{",
                  source,
                  re.S,
              )
              if not polling_match:
                  raise SystemExit(f'{path}: polling destructure not found')
              polling_body = polling_match.group('body')
              if 'error: pollError,' not in polling_body:
                  polling_body = polling_body.replace('    isPolling,', '    isPolling,\n    error: pollError,')
              if '    refetch,' not in polling_body:
                  polling_body = polling_body.replace('    error: pollError,', '    error: pollError,\n    refetch,')
              source = source[:polling_match.start('body')] + polling_body + source[polling_match.end('body'):]

              not_found_marker = '  if (!match || !tournament) {'
              marker_index = source.index(not_found_marker)
              error_block = textwrap.dedent("""\
                if (pollError && !pollData) {
                  const notFound = isSharedMatchNotFoundError(pollError);
                  return (
                    <div className="min-h-screen flex items-center justify-center">
                      <div className="space-y-3 text-center">
                        <p>{notFound ? tMatch('matchNotFound') : tCommon('networkError')}</p>
                        {!notFound && (
                          <Button type="button" variant="outline" onClick={() => void refetch()}>
                            {tCommon('tryAgain')}
                          </Button>
                        )}
                      </div>
                    </div>
                  );
                }

              """)
              source = source[:marker_index] + error_block + source[marker_index:]
              path.write_text(source)

          test = app / '__tests__/static/shared-match-load-error-contract.test.ts'
          test.write_text(textwrap.dedent("""\
          import fs from 'fs';
          import path from 'path';

          const helper = fs.readFileSync(path.join(process.cwd(), 'src/lib/shared-match-page-data.ts'), 'utf8');
          const pagePaths = [
            'src/app/tournaments/[id]/bm/match/[matchId]/page.tsx',
            'src/app/tournaments/[id]/mr/match/[matchId]/page.tsx',
            'src/app/tournaments/[id]/gp/match/[matchId]/page.tsx',
          ];
          const pages = pagePaths.map((filePath) => fs.readFileSync(path.join(process.cwd(), filePath), 'utf8'));

          describe('shared match detail load error contract (issue #3647)', () => {
            it('distinguishes not-found from generic transport/load failures', () => {
              expect(helper).toContain('matchResponse.status === 404 || tournamentResponse.status === 404');
              expect(helper).toContain('throw new SharedMatchNotFoundError();');
              expect(helper).toContain('throw new SharedMatchLoadError();');
              expect(helper).toContain("logger.error('Shared match page fetch returned a generic error response'");
              expect(helper).toContain("logger.error('Failed to load shared match page data'");
              expect(helper).toContain('message: error.message');
              expect(helper).toContain('stack: error.stack');
            });

            it('keeps the existing endpoints and response unwrapping in the shared loader', () => {
              expect(helper).toContain('`/api/tournaments/${tournamentId}/${modePath}/match/${matchId}`');
              expect(helper).toContain('`/api/tournaments/${tournamentId}?fields=summary`');
              expect(helper).toContain('match: (matchJson.data ?? matchJson) as TMatch');
              expect(helper).toContain('tournament: (tournamentJson.data ?? tournamentJson) as TTournament');
            });

            it.each(pages)('shows localized initial-load errors with retry without hiding stale polling data', (page) => {
              expect(page).toContain('error: pollError,');
              expect(page).toContain('refetch,');
              expect(page).toContain('if (pollError && !pollData)');
              expect(page).toContain('isSharedMatchNotFoundError(pollError)');
              expect(page).toContain("tMatch('matchNotFound')");
              expect(page).toContain("tCommon('networkError')");
              expect(page).toContain("tCommon('tryAgain')");
              expect(page).toContain('onClick={() => void refetch()}');
              expect(page).toContain('interval: POLLING_INTERVAL,');
              expect(page).not.toMatch(/Failed to fetch (BM|MR|GP) match data:/);
            });
          });
          """))

          docs = Path('docs/shared-match-detail-load-error-contract.md')
          docs.write_text(textwrap.dedent("""\
          # Shared match detail load error contract

          BM, MR, and GP public match detail/share pages use the same initial-load error contract.

          ## User-facing behavior

          - A 404 from either the mode match endpoint or tournament summary is treated as `match.matchNotFound`.
          - Other non-2xx responses, request rejections, and response parse failures show `common.networkError`.
          - Generic initial-load failures include a `common.tryAgain` action that reuses the polling hook's `refetch()` path.
          - Once valid match data has loaded, a later polling failure does not replace the existing match display with an error screen; stale data stays visible while the next poll can recover.
          - Browser/runtime error strings and HTTP status details are kept in the client logger rather than exposed to the user.

          ## Preserved behavior

          The BM/MR/GP match endpoints, tournament-summary endpoint, polling interval, response-wrapper unwrapping, participant/admin authorization, and score-reporting flows are unchanged. Only the read-side initial-load classification and recovery UI are shared by `shared-match-page-data.ts`.
          """))
          PY

      - name: Install dependencies and format changed files
        working-directory: smkc-score-app
        env:
          HUSKY: "0"
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.4
          test "$(npm --version)" = "10.9.4"
          npm ci
          npx prettier --write \
            'src/lib/shared-match-page-data.ts' \
            'src/app/tournaments/[id]/bm/match/[matchId]/page.tsx' \
            'src/app/tournaments/[id]/mr/match/[matchId]/page.tsx' \
            'src/app/tournaments/[id]/gp/match/[matchId]/page.tsx' \
            '__tests__/static/shared-match-load-error-contract.test.ts' \
            '../docs/shared-match-detail-load-error-contract.md'

      - name: Run targeted regression and lint checks
        working-directory: smkc-score-app
        env:
          SKIP_OPENNEXT_CLOUDFLARE_DEV: "1"
          NODE_ENV: test
        run: |
          npm test -- --runInBand __tests__/static/shared-match-load-error-contract.test.ts
          npx eslint \
            'src/lib/shared-match-page-data.ts' \
            'src/app/tournaments/[id]/bm/match/[matchId]/page.tsx' \
            'src/app/tournaments/[id]/mr/match/[matchId]/page.tsx' \
            'src/app/tournaments/[id]/gp/match/[matchId]/page.tsx' \
            '__tests__/static/shared-match-load-error-contract.test.ts'

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'smkc-score-app/src/lib/shared-match-page-data.ts' \
            'smkc-score-app/src/app/tournaments/[id]/bm/match/[matchId]/page.tsx' \
            'smkc-score-app/src/app/tournaments/[id]/mr/match/[matchId]/page.tsx' \
            'smkc-score-app/src/app/tournaments/[id]/gp/match/[matchId]/page.tsx' \
            'smkc-score-app/__tests__/static/shared-match-load-error-contract.test.ts' \
            'docs/shared-match-detail-load-error-contract.md'
          git commit -m 'fix: distinguish shared match load failures (#3647)'
          git push origin HEAD:fix/3647-shared-match-load-errors
