name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# Keep the compatibility workflow read-only while #3499 establishes the
# repository-level merge gate. Its visible check names stay distinct from the
# standard CI checks so branch protection can select the intended source
# unambiguously.
concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: PR Compatibility Lint & Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: smkc-score-app

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate Node 24 action pins
        working-directory: .
        run: |
          set -euo pipefail
          failed=0

          while IFS= read -r action; do
            case "$action" in
              actions/checkout@v*|actions/setup-node@v*|actions/cache@v*)
                major="${action##*@v}"
                major="${major%%.*}"
                if [ "$major" -lt 5 ]; then
                  echo "::error::Node 20 action is not allowed: $action"
                  failed=1
                fi
                ;;
              actions/upload-artifact@v*)
                major="${action##*@v}"
                major="${major%%.*}"
                if [ "$major" -lt 6 ]; then
                  echo "::error::Node 20 upload-artifact is not allowed: $action"
                  failed=1
                fi
                ;;
              fountainhead/action-wait-for-check@*)
                echo "::error::fountainhead/action-wait-for-check currently targets Node 20: $action"
                failed=1
                ;;
            esac
          done < <(
            grep -RhE '^[[:space:]-]*uses:[[:space:]]*[^[:space:]]+' .github/workflows \
              | sed -E 's/^[[:space:]-]*uses:[[:space:]]*//' \
              | sed -E 's/[[:space:]]+#.*$//'
          )

          exit "$failed"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: smkc-score-app/package-lock.json

      - name: Pin npm
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.4
          test "$(npm --version)" = "10.9.4"

      - name: Install dependencies
        run: npm ci
        env:
          # PR validation never needs local Git hooks; skip Husky setup/noise.
          HUSKY: "0"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci --forceExit
        env:
          SKIP_OPENNEXT_CLOUDFLARE_DEV: "1"
          NODE_ENV: test
          NODE_OPTIONS: "--max-old-space-size=4096"

  wait-cloudflare-build:
    # Ordinary feature PRs intentionally no longer require a Cloudflare
    # deployment: GitHub CI validates them, while the fixed preview is updated
    # only through the long-lived preview branch.
    name: Wait for Cloudflare Workers Build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cloudflare feature-branch build intentionally disabled
        run: |
          echo "Feature PRs are validated by GitHub CI and do not require a Cloudflare Workers Build."
          echo "Deploy the long-lived preview branch when fixed-preview/E2E validation is required."

  claude-review:
    # Retained as a successful compatibility gate, but it is intentionally
    # read-only. Auto-merge stays disabled until #3499 establishes required
    # status checks at the repository policy layer.
    needs: [lint-and-test, wait-cloudflare-build]
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Claude automatic review and auto-merge disabled
        run: |
          echo "Claude automatic PR review is disabled for this repository."
          echo "Auto-merge remains disabled until required status checks are enforced (issue #3499)."
