name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Keep the existing workflow/check names so branch protection and existing PRs
# continue to see the same gates. Claude review itself is intentionally disabled.
concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: smkc-score-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: smkc-score-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci --forceExit
        env:
          SKIP_OPENNEXT_CLOUDFLARE_DEV: "1"
          NODE_ENV: test
          NODE_OPTIONS: "--max-old-space-size=4096"

  wait-cloudflare-build:
    name: Wait for Cloudflare Workers Build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: 'Wait for Workers Builds: smkc check'
        uses: fountainhead/action-wait-for-check@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: "Workers Builds: smkc"
          ref: ${{ github.event.pull_request.head.sha }}
          timeoutSeconds: 1800
          intervalSeconds: 20

  claude-review:
    # Intentionally retained as a successful compatibility gate, but it no
    # longer invokes anthropics/claude-code-action or requires a Claude review.
    needs: [lint-and-test, wait-cloudflare-build]
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Claude automatic review disabled
        run: echo "Claude automatic PR review is disabled for this repository."

      - name: Enable auto-merge
        continue-on-error: true
        if: github.event.pull_request.draft == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
