name: Cleanup Cloudflare filter probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-cloudflare-filter-probe.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-cloudflare-filter-probe
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete verified Cloudflare filter probe branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify and delete exact probe branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ops/verify-cloudflare-build-filter
          EXPECTED_HEAD: 6fa0fdc882604a8f9e2bde043f285cd98a66c45d
          EXPECTED_FILE: smkc-score-app/docs/.cloudflare-build-filter-probe-2026-09-11.md
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Refusing cleanup outside main: ${GITHUB_REF}" >&2
            exit 1
          fi

          api="${GITHUB_API_URL}"
          repo="${GITHUB_REPOSITORY}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          urlencode() {
            jq -rn --arg value "$1" '$value|@uri'
          }

          api_get() {
            curl --fail --silent --show-error \
              -H "$auth_header" \
              -H "$accept_header" \
              -H "$version_header" \
              "$1"
          }

          encoded_branch="$(urlencode "$TARGET_BRANCH")"
          branch_url="${api}/repos/${repo}/branches/${encoded_branch}"
          branch_json="$(api_get "$branch_url")"
          protected="$(jq -r '.protected' <<<"$branch_json")"
          head_sha="$(jq -r '.commit.sha' <<<"$branch_json")"

          if [ "$protected" != "false" ]; then
            echo "Refusing to delete protected probe branch" >&2
            exit 1
          fi
          if [ "$head_sha" != "$EXPECTED_HEAD" ]; then
            echo "Refusing to delete probe branch with unexpected HEAD: $head_sha" >&2
            exit 1
          fi

          compare_ref="$(urlencode "main...${TARGET_BRANCH}")"
          compare_json="$(api_get "${api}/repos/${repo}/compare/${compare_ref}")"
          ahead_by="$(jq -r '.ahead_by' <<<"$compare_json")"
          files_length="$(jq -r '.files | length' <<<"$compare_json")"
          only_filename="$(jq -r '.files[0].filename // ""' <<<"$compare_json")"
          only_status="$(jq -r '.files[0].status // ""' <<<"$compare_json")"

          if [ "$ahead_by" != "1" ] || [ "$files_length" != "1" ] || [ "$only_filename" != "$EXPECTED_FILE" ] || [ "$only_status" != "added" ]; then
            echo "Refusing to delete probe branch: unexpected main comparison evidence" >&2
            echo "ahead_by=$ahead_by files_length=$files_length filename=$only_filename status=$only_status" >&2
            exit 1
          fi

          open_prs="$(curl --fail --silent --show-error --get \
            -H "$auth_header" \
            -H "$accept_header" \
            -H "$version_header" \
            --data-urlencode 'state=open' \
            --data-urlencode "head=${owner}:${TARGET_BRANCH}" \
            "${api}/repos/${repo}/pulls")"
          open_pr_count="$(jq 'length' <<<"$open_prs")"
          if [ "$open_pr_count" != "0" ]; then
            echo "Refusing to delete probe branch used by $open_pr_count open PR(s)" >&2
            exit 1
          fi

          final_branch_json="$(api_get "$branch_url")"
          final_head_sha="$(jq -r '.commit.sha' <<<"$final_branch_json")"
          final_protected="$(jq -r '.protected' <<<"$final_branch_json")"
          if [ "$final_protected" != "false" ] || [ "$final_head_sha" != "$EXPECTED_HEAD" ]; then
            echo "Refusing to delete probe branch whose state changed during verification" >&2
            exit 1
          fi

          ref_url="${api}/repos/${repo}/git/refs/heads/${encoded_branch}"
          curl --fail --silent --show-error \
            -X DELETE \
            -H "$auth_header" \
            -H "$accept_header" \
            -H "$version_header" \
            "$ref_url" \
            >/dev/null

          verify_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "$auth_header" \
            -H "$accept_header" \
            -H "$version_header" \
            "$branch_url")"
          if [ "$verify_status" != "404" ]; then
            echo "Probe branch deletion could not be verified (HTTP $verify_status)" >&2
            exit 1
          fi

          {
            echo "## Cloudflare filter probe cleanup"
            echo
            echo "- branch: \`$TARGET_BRANCH\`"
            echo "- expected head: \`$EXPECTED_HEAD\`"
            echo "- expected only changed file: \`$EXPECTED_FILE\`"
            echo "- open PR head uses: 0"
            echo "- result: deleted and verified absent"
          } >> "$GITHUB_STEP_SUMMARY"
