name: Format PR 3212 current changes

on:
  push:
    branches:
      - feat/3054-comparison-ui
    paths:
      - .github/workflows/format-3212-current.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smkc-score-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smkc-score-app/package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.4
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: npx prettier --write __tests__/components/tournament/qualification-schedule-diagnostics-panel.test.tsx docs/qualification-schedule-comparison.md src/components/tournament/qualification-schedule-diagnostics-panel.tsx
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add __tests__/components/tournament/qualification-schedule-diagnostics-panel.test.tsx docs/qualification-schedule-comparison.md src/components/tournament/qualification-schedule-diagnostics-panel.tsx
          if git diff --cached --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git commit -m 'style: format PR 3212 changed files'
          git push origin HEAD:feat/3054-comparison-ui
