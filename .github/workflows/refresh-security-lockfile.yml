name: Refresh security lockfile

on:
  push:
    branches:
      - feat/3054-decision-checklist
    paths:
      - .github/workflows/refresh-security-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/3054-decision-checklist
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smkc-score-app/package-lock.json
      - name: Pin npm
        run: |
          npm install --global npm@10.9.4
          test "$(npm --version)" = "10.9.4"
      - name: Refresh vulnerable packages within existing ranges
        working-directory: smkc-score-app
        run: |
          npm update next eslint-config-next js-yaml sharp --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- smkc-score-app/package-lock.json; then
            echo "No lockfile changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smkc-score-app/package-lock.json
          git commit -m "chore: refresh security dependency lock"
          git push origin HEAD:feat/3054-decision-checklist
