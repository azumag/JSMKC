name: Patch Skeleton drift guards

on:
  push:
    branches:
      - test/3677-skeleton-drift-semantics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Replace brittle Skeleton drift assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('smkc-score-app/__tests__/docs/e2e-cases-drift.test.ts')
          source = path.read_text()

          variable_anchor = """  const qualificationFallbackTest = readRepoFile(
            'smkc-score-app',
            '__tests__',
            'components',
            'ui',
            'loading-skeleton.test.tsx',
          );
          """
          variable_replacement = variable_anchor + """  const loadingSkeletonContractTest = readRepoFile(
            'smkc-score-app',
            '__tests__',
            'static',
            'loading-skeleton-contract.test.ts',
          );
          """

          tc2095_old = """    expect(loadingSkeleton).toContain('titleSkeletonClassName = \\\"w-48\\\"');
              expect(qualificationFallbackTest).toContain('uses the qualification page title skeleton width by default');
          """
          tc2095_new = """    // The AST-backed contract owns the source-level default check; the component test owns rendered behavior.
              expect(loadingSkeletonContractTest).toContain("titleSkeletonBinding.initializer.text).toBe('w-48')");
              expect(qualificationFallbackTest).toContain("getByTestId('title-skeleton')).toHaveClass('w-48')");
          """

          tc2401_structure_old = """    // Skeleton props spread must come before role/aria-label so callers cannot override them
              expect(loadingSkeleton).toContain('{...props}');
              expect(loadingSkeleton).toMatch(/\\{\\.\\.\\.props\\}[\\s\\S]{0,20}role=\\\"status\\\"/);
              expect(loadingSkeleton).toMatch(/\\{\\.\\.\\.props\\}[\\s\\S]{0,50}aria-label=\\\"Loading content\\\"/);
          """
          tc2401_structure_new = """    // The AST-backed contract verifies ownership/order without coupling this docs guard to quote style or locale text.
              expect(loadingSkeletonContractTest).toContain('expect(roleIndex).toBeGreaterThan(spreadIndex)');
              expect(loadingSkeletonContractTest).toContain('expect(ariaLabelIndex).toBeGreaterThan(spreadIndex)');
              expect(loadingSkeletonContractTest).toContain("expression.arguments[0].text === 'ariaLabel'");
          """

          tc2401_runtime_old = """    expect(qualificationFallbackTest).toContain('TC-2401');
              expect(qualificationFallbackTest).toContain(
                'always renders with role=\\\"status\\\" even when caller passes a different role',
              );
              expect(qualificationFallbackTest).toContain(
                'always renders with aria-label even when caller passes a different aria-label',
              );
              expect(qualificationFallbackTest).toContain("getByTestId('title-skeleton')");
          """
          tc2401_runtime_new = """    expect(qualificationFallbackTest).toContain('TC-2401');
              expect(qualificationFallbackTest).toContain("getByRole('status')");
              expect(qualificationFallbackTest).toContain("queryByRole('img')");
              expect(qualificationFallbackTest).toContain("queryByLabelText('custom label')");
              expect(qualificationFallbackTest).toContain("name: 'コンテンツを読み込み中'");
          """

          replacements = [
              ('semantic contract source binding', variable_anchor, variable_replacement),
              ('TC-2095 source/test-title coupling', tc2095_old, tc2095_new),
              ('TC-2401 source-literal coupling', tc2401_structure_old, tc2401_structure_new),
              ('TC-2401 test-title coupling', tc2401_runtime_old, tc2401_runtime_new),
          ]

          for label, old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

          git diff --check

      - name: Remove temporary patch workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/patch-skeleton-drift.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smkc-score-app/__tests__/docs/e2e-cases-drift.test.ts
          git diff --cached --check
          git commit -m 'test: make Skeleton docs drift guards semantic'
          git push origin HEAD:test/3677-skeleton-drift-semantics
