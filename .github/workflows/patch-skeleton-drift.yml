name: Patch Skeleton drift guards

on:
  push:
    branches:
      - test/3677-skeleton-drift-semantics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Replace brittle Skeleton drift assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('smkc-score-app/__tests__/docs/e2e-cases-drift.test.ts')
          lines = path.read_text().splitlines()

          def unique_index(fragment: str) -> int:
              matches = [index for index, line in enumerate(lines) if fragment in line]
              if len(matches) != 1:
                  raise SystemExit(f'{fragment!r}: expected exactly one matching line, found {len(matches)}')
              return matches[0]

          # Bind the existing AST-backed contract test without relying on production formatting.
          start = unique_index('const qualificationFallbackTest = readRepoFile(')
          end = next((index for index in range(start + 1, len(lines)) if lines[index].strip() == ');'), None)
          if end is None:
              raise SystemExit('qualificationFallbackTest: closing ); not found')
          contract_binding = [
              "  const loadingSkeletonContractTest = readRepoFile(",
              "    'smkc-score-app',",
              "    '__tests__',",
              "    'static',",
              "    'loading-skeleton-contract.test.ts',",
              '  );',
          ]
          lines[end + 1:end + 1] = contract_binding

          # TC-2095: use semantic/static and rendered-behavior coverage, not quote style or test title text.
          index = unique_index("titleSkeletonClassName = \\\"w-48\\\"")
          if 'uses the qualification page title skeleton width by default' not in lines[index + 1]:
              raise SystemExit('TC-2095 legacy test-title assertion moved unexpectedly')
          lines[index:index + 2] = [
              '    // The AST-backed contract owns the source-level default check; the component test owns rendered behavior.',
              '    expect(loadingSkeletonContractTest).toContain("titleSkeletonBinding.initializer.text).toBe(\'w-48\')");',
              '    expect(qualificationFallbackTest).toContain("getByTestId(\'title-skeleton\')).toHaveClass(\'w-48\')");',
          ]

          # TC-2401: delegate JSX ordering/localization to the AST contract instead of fixed English source text.
          index = unique_index('Skeleton props spread must come before role/aria-label')
          expected_fragments = ['{...props}', 'role=', 'aria-label=']
          for offset, fragment in enumerate(expected_fragments, start=1):
              if fragment not in lines[index + offset]:
                  raise SystemExit(f'TC-2401 legacy structure assertion {fragment!r} moved unexpectedly')
          lines[index:index + 4] = [
              '    // The AST-backed contract verifies ownership/order without coupling this docs guard to quote style or locale text.',
              "    expect(loadingSkeletonContractTest).toContain('expect(roleIndex).toBeGreaterThan(spreadIndex)');",
              "    expect(loadingSkeletonContractTest).toContain('expect(ariaLabelIndex).toBeGreaterThan(spreadIndex)');",
              '    expect(loadingSkeletonContractTest).toContain("expression.arguments[0].text === \'ariaLabel\'");',
          ]

          # TC-2401 runtime coverage: assert stable behavior expressions, never human-readable test titles.
          index = unique_index("expect(qualificationFallbackTest).toContain('TC-2401');")
          legacy_runtime = '\n'.join(lines[index:index + 8])
          for fragment in [
              'always renders with role=',
              'always renders with aria-label',
              "getByTestId('title-skeleton')",
          ]:
              if fragment not in legacy_runtime:
                  raise SystemExit(f'TC-2401 legacy runtime assertion {fragment!r} moved unexpectedly')
          lines[index:index + 8] = [
              "    expect(qualificationFallbackTest).toContain('TC-2401');",
              '    expect(qualificationFallbackTest).toContain("getByRole(\'status\')");',
              '    expect(qualificationFallbackTest).toContain("queryByRole(\'img\')");',
              '    expect(qualificationFallbackTest).toContain("queryByLabelText(\'custom label\')");',
              '    expect(qualificationFallbackTest).toContain("name: \'コンテンツを読み込み中\'");',
          ]

          updated = '\n'.join(lines) + '\n'
          for forbidden in [
              'uses the qualification page title skeleton width by default',
              'always renders with role="status" even when caller passes a different role',
              'always renders with aria-label even when caller passes a different aria-label',
          ]:
              if forbidden in updated:
                  raise SystemExit(f'legacy title coupling still present: {forbidden}')

          path.write_text(updated)
          PY

          git diff --check

      - name: Remove temporary patch workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/patch-skeleton-drift.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smkc-score-app/__tests__/docs/e2e-cases-drift.test.ts
          git diff --cached --check
          git commit -m 'test: make Skeleton docs drift guards semantic'
          git push origin HEAD:test/3677-skeleton-drift-semantics
