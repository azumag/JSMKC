name: Issue 3604 format

on:
  push:
    branches:
      - fix/3604-ta-sudden-death-network-errors

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/3604-ta-sudden-death-network-errors
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smkc-score-app/package-lock.json
      - name: Format changed test
        working-directory: smkc-score-app
        run: npx --yes prettier@3.6.2 --write __tests__/components/tournament/ta-sudden-death-panel.test.tsx
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/issue-3604-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smkc-score-app/__tests__/components/tournament/ta-sudden-death-panel.test.tsx .github/workflows/issue-3604-format.yml
          git commit -m 'style: format TA sudden-death tests (#3604)'
          git push origin HEAD:fix/3604-ta-sudden-death-network-errors
