name: CI

on:
  push:
    branches: [main]
    paths:
      - "smkc-score-app/**"
  pull_request:
    paths:
      - "smkc-score-app/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-parity:
    name: Prisma / D1 migration parity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: smkc-score-app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a new Prisma migration has no matching D1 migration file
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          added_prisma=$(git diff --diff-filter=A --name-only "$BASE_SHA" "$HEAD_SHA" -- prisma/migrations | grep '/migration\.sql$' || true)
          added_d1=$(git diff --diff-filter=A --name-only "$BASE_SHA" "$HEAD_SHA" -- migrations | grep '\.sql$' || true)
          prisma_count=$(printf '%s\n' "$added_prisma" | grep -c . || true)
          d1_count=$(printf '%s\n' "$added_d1" | grep -c . || true)
          if [ "$prisma_count" -ne "$d1_count" ]; then
            echo "::error::This PR adds ${prisma_count} Prisma migration(s) but ${d1_count} D1 migration file(s) under smkc-score-app/migrations/ — they must match 1:1."
            echo "D1 (Cloudflare Workers) does not read prisma/migrations — it needs a hand-written"
            echo "equivalent .sql file under migrations/, applied via 'wrangler d1 migrations apply'."
            echo "Without it, the deployed Worker's Prisma Client expects columns/tables that don't"
            echo "exist in D1, and every query touching them fails at runtime. See CLAUDE.md."
            echo ""
            echo "New Prisma migration(s):"
            echo "$added_prisma"
            echo ""
            echo "New D1 migration file(s):"
            echo "$added_d1"
            exit 1
          fi

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: smkc-score-app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: smkc-score-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply Prettier to CI contract test once
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          npx prettier --write __tests__/docs/ci-config.test.ts
          if ! git diff --quiet -- __tests__/docs/ci-config.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add __tests__/docs/ci-config.test.ts
            git commit -m "style: format CI contract test"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Lint
        run: npm run lint

      - name: Check formatting of changed files
        run: npm run format:check
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORMAT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Unit tests
        run: npm test -- --ci --forceExit
        env:
          SKIP_OPENNEXT_CLOUDFLARE_DEV: "1"
          NODE_ENV: test
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Security audit
        run: npm audit --audit-level=high
