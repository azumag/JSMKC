name: CI

on:
  push:
    branches: [main]
    paths:
      - "smkc-score-app/**"
  pull_request:
    paths:
      - "smkc-score-app/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-parity:
    name: Prisma / D1 migration parity
    # PR-only: a merge to main is too late to block, and d1-migrate.yml only
    # triggers when smkc-score-app/migrations/** changes — a PR that adds a
    # Prisma migration but forgets the D1 file never touches that path, so
    # nothing else catches it. This job exists because that exact gap shipped
    # broken player loading to prod and preview (PR #3055): the Prisma
    # migration for qrLoginTokenHash landed, the D1 migration file did not,
    # and every Player query 500'd until a manual hotfix.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: smkc-score-app

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fail if a new Prisma migration has no matching D1 migration file
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          added_prisma=$(git diff --diff-filter=A --name-only "$BASE_SHA" "$HEAD_SHA" -- prisma/migrations | grep '/migration\.sql$' || true)
          added_d1=$(git diff --diff-filter=A --name-only "$BASE_SHA" "$HEAD_SHA" -- migrations | grep '\.sql$' || true)

          # Issue #3064: compare counts (1:1 parity), not mere existence, so a
          # PR adding two Prisma migrations but only one D1 file still fails.
          prisma_count=$(printf '%s\n' "$added_prisma" | grep -c . || true)
          d1_count=$(printf '%s\n' "$added_d1" | grep -c . || true)

          if [ "$prisma_count" -ne "$d1_count" ]; then
            echo "::error::This PR adds ${prisma_count} Prisma migration(s) but ${d1_count} D1 migration file(s) under smkc-score-app/migrations/ — they must match 1:1."
            echo "D1 (Cloudflare Workers) does not read prisma/migrations — it needs a hand-written"
            echo "equivalent .sql file under migrations/, applied via 'wrangler d1 migrations apply'."
            echo "Without it, the deployed Worker's Prisma Client expects columns/tables that don't"
            echo "exist in D1, and every query touching them fails at runtime. See CLAUDE.md."
            echo ""
            echo "New Prisma migration(s):"
            echo "$added_prisma"
            echo ""
            echo "New D1 migration file(s):"
            echo "$added_d1"
            exit 1
          fi

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: smkc-score-app

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: smkc-score-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting of changed files
        run: |
          ./node_modules/.bin/prettier --write scripts/security-audit.js
          git diff -- scripts/security-audit.js
          exit 1

      - name: Unit tests
        # Keep functional validation independent from the dependency audit so a
        # pre-existing advisory does not hide regressions in the PR under test.
        run: npm test -- --ci --forceExit
        env:
          SKIP_OPENNEXT_CLOUDFLARE_DEV: "1"
          NODE_ENV: test
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Security audit
        # Fail closed for all high/critical findings except the exact, dev-only
        # Prisma -> deepmerge-ts advisory tracked in #3114. The helper validates
        # the advisory id, dependency graph, package version and devOptional bit;
        # any drift or any additional high/critical finding remains blocking.
        run: node scripts/security-audit.js
