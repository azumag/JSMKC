name: D1 cf Preview Parity

on:
  pull_request:
    paths:
      - ".github/workflows/d1-cf-preview-parity.yml"
      - "smkc-score-app/package.json"
      - "smkc-score-app/scripts/cloudflare-cf-parity.cjs"
      - "smkc-score-app/scripts/cloudflare-cf-runner.cjs"
      - "smkc-score-app/scripts/cloudflare-d1-migration-plan.cjs"
      - "smkc-score-app/scripts/cloudflare-d1-remote-parity.cjs"
      - "smkc-score-app/scripts/cloudflare-d1-target.cjs"
      - "smkc-score-app/wrangler.toml"
      - "smkc-score-app/migrations/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/d1-cf-preview-parity.yml"
      - "smkc-score-app/package.json"
      - "smkc-score-app/scripts/cloudflare-cf-parity.cjs"
      - "smkc-score-app/scripts/cloudflare-cf-runner.cjs"
      - "smkc-score-app/scripts/cloudflare-d1-migration-plan.cjs"
      - "smkc-score-app/scripts/cloudflare-d1-remote-parity.cjs"
      - "smkc-score-app/scripts/cloudflare-d1-target.cjs"
      - "smkc-score-app/wrangler.toml"
      - "smkc-score-app/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-cf-preview-parity-${{ github.ref }}
  cancel-in-progress: false

env:
  CF_PARITY_VERSION: 1.0.0-beta.24

jobs:
  surface:
    name: Verify pinned cf read-only surface
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.23.4"

      - name: Install pinned cf CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund "cf@${CF_PARITY_VERSION}"

      - name: Verify cf D1 command surface
        working-directory: smkc-score-app
        run: node scripts/cloudflare-cf-parity.cjs

  remote_preview:
    name: Compare Wrangler and cf against preview D1 (read-only)
    if: github.event_name != 'pull_request'
    needs: surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.23.4"
          cache: "npm"
          cache-dependency-path: smkc-score-app/package-lock.json

      - name: Pin npm
        working-directory: smkc-score-app
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.4
          test "$(npm --version)" = "10.9.4"

      - name: Install dependencies
        working-directory: smkc-score-app
        run: npm ci
        env:
          HUSKY: "0"

      - name: Install pinned cf CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund "cf@${CF_PARITY_VERSION}"

      - name: Verify cf D1 command surface before remote access
        working-directory: smkc-score-app
        run: node scripts/cloudflare-cf-parity.cjs

      - name: Compare preview pending migrations (read-only)
        working-directory: smkc-score-app
        # npm injects the repository-local node_modules/.bin directory, so the
        # incumbent Wrangler comparison always uses the lockfile-installed tool.
        run: npm run cloudflare:d1-preview-parity
        env:
          CI: "true"
          NO_COLOR: "1"
          CF_QUIET: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
