name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          echo "Deleting branch: $BRANCH"

          ref_api="repos/$REPO/git/ref/heads/$BRANCH"
          delete_api="repos/$REPO/git/refs/heads/$BRANCH"

          set +e
          probe_output=$(gh api --silent "$ref_api" 2>&1)
          probe_status=$?
          set -e

          if [ "$probe_status" -ne 0 ]; then
            if printf '%s\n' "$probe_output" | grep -Fq '(HTTP 404)'; then
              echo "Branch already deleted or not found: $BRANCH"
              exit 0
            fi

            printf '%s\n' "$probe_output" >&2
            echo "Failed to inspect branch before deletion: $BRANCH" >&2
            exit "$probe_status"
          fi

          set +e
          delete_output=$(gh api -X DELETE "$delete_api" 2>&1)
          delete_status=$?
          set -e

          if [ "$delete_status" -eq 0 ]; then
            echo "Deleted branch: $BRANCH"
            exit 0
          fi

          set +e
          post_probe_output=$(gh api --silent "$ref_api" 2>&1)
          post_probe_status=$?
          set -e

          if [ "$post_probe_status" -ne 0 ] && printf '%s\n' "$post_probe_output" | grep -Fq '(HTTP 404)'; then
            echo "Branch was deleted concurrently: $BRANCH"
            exit 0
          fi

          printf '%s\n' "$delete_output" >&2
          if [ "$post_probe_status" -ne 0 ]; then
            printf '%s\n' "$post_probe_output" >&2
          fi
          echo "Failed to delete branch: $BRANCH" >&2
          exit "$delete_status"
