name: Diagnose #3211 Cloudflare build

on:
  push:
    branches:
      - fix/3210-security-lock-refresh

permissions:
  contents: read

jobs:
  build:
    name: OpenNext Cloudflare build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smkc-score-app
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: smkc-score-app/package-lock.json
      - name: Pin npm
        run: |
          npm install --global npm@10.9.4
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Show resolved Cloudflare toolchain
        run: npm ls next @opennextjs/cloudflare @opennextjs/aws wrangler miniflare sharp --depth=2
      - name: Build OpenNext worker
        run: npm run build:cf
