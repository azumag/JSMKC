name: Apply issue 3588 implementation

on:
  push:
    branches:
      - fix/3588-match-report-error-fallbacks

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: fix/3588-match-report-error-fallbacks
          fetch-depth: 0
      - name: Apply match report error fallbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('smkc-score-app')
          old_blocks = {
              'mr': '\n'.join([
                  '      } else {',
                  '        const data = await response.json();',
                  "        setError(data.error || 'Failed to submit result');",
                  '      }',
                  '    } catch (err) {',
                  "      logger.error('Failed to submit result:', { error: err });",
                  "      setError('Failed to submit result');",
              ]),
              'gp': '\n'.join([
                  '      } else {',
                  '        const data = await response.json();',
                  "        setError(data.error || tMatch('submitResult'));",
                  '      }',
                  '    } catch (err) {',
                  "      logger.error('Failed to submit result:', { error: err });",
                  "      setError(tMatch('submitResult'));",
              ]),
          }
          new_block = '\n'.join([
              '      } else {',
              '        const data = await response.json().catch(() => ({}));',
              "        setError(data.error || tCommon('networkError'));",
              '      }',
              '    } catch (err) {',
              "      logger.error('Failed to submit result:', { error: err });",
              "      setError(tCommon('networkError'));",
          ])

          for mode, old_block in old_blocks.items():
              page = root / 'src' / 'app' / 'tournaments' / '[id]' / mode / 'match' / '[matchId]' / 'page.tsx'
              source = page.read_text()
              if old_block not in source:
                  raise SystemExit(f'{mode}: submit error block not found')
              page.write_text(source.replace(old_block, new_block, 1))

          test_lines = [
              "import fs from 'fs';",
              "import path from 'path';",
              '',
              "function readMatchPage(mode: 'mr' | 'gp') {",
              '  return fs.readFileSync(',
              "    path.join(process.cwd(), 'src', 'app', 'tournaments', '[id]', mode, 'match', '[matchId]', 'page.tsx'),",
              "    'utf8',",
              '  );',
              '}',
              '',
              "describe('MR/GP match report error fallback contract (issue #3588)', () => {",
              "  it.each(['mr', 'gp'] as const)('%s preserves API errors and localizes generic submit failures', (mode) => {",
              '    const source = readMatchPage(mode);',
              '',
              "    expect(source).toContain('const data = await response.json().catch(() => ({}));');",
              "    expect(source).toContain(\"setError(data.error || tCommon('networkError'));\");",
              "    expect(source).toContain(\"logger.error('Failed to submit result:', { error: err });\");",
              "    expect(source).toContain(\"setError(tCommon('networkError'));\");",
              '  });',
              '',
              "  it('removes the MR hard-coded English generic failure', () => {",
              "    expect(readMatchPage('mr')).not.toContain(\"setError('Failed to submit result');\");",
              '  });',
              '',
              "  it('does not use the GP submit button label as an error fallback', () => {",
              "    expect(readMatchPage('gp')).not.toContain(\"setError(data.error || tMatch('submitResult'));\");",
              '  });',
              '});',
              '',
          ]
          (root / '__tests__' / 'static' / 'match-report-error-fallbacks.test.ts').write_text('\n'.join(test_lines))

          docs_lines = [
              '# Match report error feedback contract',
              '',
              'MR / GP の公開 match detail から結果を送信する場合、利用者向け generic error と診断情報を分離する。',
              '',
              '## 表示契約',
              '',
              '- report API が具体的な `error` を返す non-2xx では、その API メッセージを優先する。',
              '- API error のない non-2xx は `common.networkError` を表示する。',
              '- error response body が JSON でない場合も `common.networkError` にフォールバックする。',
              '- `fetch()` rejection は `common.networkError` を表示し、raw error は client logger に残す。',
              '- generic failure に英語ハードコードや `match.submitResult` のボタンラベルを流用しない。',
              '',
              '## 非変更事項',
              '',
              'report endpoint / payload、入力 validation、認可、成功時の `setSubmitted(true)` と `refetch()`、`submitting` の cleanup は変更しない。',
              '',
          ]
          (root / 'docs' / 'match-report-error-feedback.md').write_text('\n'.join(docs_lines))

          Path('.github/workflows/issue-3588-apply.yml').unlink()
          PY
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: localize MR and GP report failures (#3588)"
          git push origin HEAD:fix/3588-match-report-error-fallbacks
