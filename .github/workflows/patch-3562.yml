name: Temporary patch 3562

on:
  push:
    branches:
      - fix/3562-qualification-confirm-error-feedback
    paths:
      - .github/workflows/patch-3562.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/3562-qualification-confirm-error-feedback

      - name: Apply qualification confirmation fallback patch
        shell: python
        run: |
          from pathlib import Path

          changes = {
              "smkc-score-app/src/app/tournaments/[id]/bm/page-client.tsx": (
                  "alert(errorData.error || 'Failed to update qualification status');",
                  "alert(errorData.error || tc('networkError'));",
                  "      logger.error('Failed to toggle qualification confirmed', { error: err, tournamentId });\n",
                  "      logger.error('Failed to toggle qualification confirmed', { error: err, tournamentId });\n      alert(tc('networkError'));\n",
              ),
              "smkc-score-app/src/app/tournaments/[id]/mr/page-client.tsx": (
                  "toast.error(errorData.error || 'Failed to update qualification status');",
                  "toast.error(errorData.error || tc('networkError'));",
                  "      logger.error('Failed to toggle qualification confirmed', { error: err, tournamentId });\n",
                  "      logger.error('Failed to toggle qualification confirmed', { error: err, tournamentId });\n      toast.error(tc('networkError'));\n",
              ),
              "smkc-score-app/src/app/tournaments/[id]/gp/page-client.tsx": (
                  "alert(errorData.error || 'Failed to update qualification status');",
                  "alert(errorData.error || tc('networkError'));",
                  "      logger.error('Failed to toggle qualification confirmed', { error: err, tournamentId });\n",
                  "      logger.error('Failed to toggle qualification confirmed', { error: err, tournamentId });\n      alert(tc('networkError'));\n",
              ),
          }

          for filename, (old_fallback, new_fallback, old_catch, new_catch) in changes.items():
              path = Path(filename)
              text = path.read_text()
              if text.count(old_fallback) != 1:
                  raise SystemExit(f"expected exactly one fallback occurrence in {filename}")
              if text.count(old_catch) != 1:
                  raise SystemExit(f"expected exactly one catch occurrence in {filename}")
              text = text.replace(old_fallback, new_fallback).replace(old_catch, new_catch)
              path.write_text(text)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smkc-score-app/src/app/tournaments/'[id]'/bm/page-client.tsx \
                  smkc-score-app/src/app/tournaments/'[id]'/mr/page-client.tsx \
                  smkc-score-app/src/app/tournaments/'[id]'/gp/page-client.tsx
          git diff --cached --check
          git commit -m "fix: localize qualification confirmation errors"
          git push origin HEAD:fix/3562-qualification-confirm-error-feedback
