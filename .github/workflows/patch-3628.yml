name: Apply issue 3628 patch

on:
  push:
    branches:
      - fix/3628-ta-admin-network-errors
    paths:
      - .github/workflows/patch-3628.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-3628.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: localize TA admin mutation failures (#3628)"
          git push origin HEAD:fix/3628-ta-admin-network-errors
