name: Automation 3460 finals response cleanup

on:
  push:
    branches:
      - automation/3460-finals-response-cleanup-20260915

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/3460-finals-response-cleanup-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smkc-score-app/package-lock.json
      - name: Install dependencies
        working-directory: smkc-score-app
        run: npm ci --ignore-scripts
      - name: Remove exactly the six unused response bindings
        working-directory: smkc-score-app
        shell: bash
        run: |
          set -euo pipefail
          target='__tests__/lib/api-factories/finals-route.test.ts'
          npx eslint "$target" -f json > /tmp/finals-eslint.json
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          const target = '__tests__/lib/api-factories/finals-route.test.ts';
          const report = JSON.parse(fs.readFileSync('/tmp/finals-eslint.json', 'utf8'));
          const messages = report[0].messages.filter(
            (m) => m.ruleId === '@typescript-eslint/no-unused-vars' && /'response'/.test(m.message),
          );
          if (messages.length !== 6) {
            throw new Error(`expected 6 unused response warnings, found ${messages.length}`);
          }
          const warningLines = new Set(messages.map((m) => m.line));
          const source = fs.readFileSync(target, 'utf8');
          const sf = ts.createSourceFile(target, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const edits = [];
          function visit(node) {
            if (ts.isVariableDeclaration(node) && ts.isIdentifier(node.name) && node.name.text === 'response') {
              const line = sf.getLineAndCharacterOfPosition(node.name.getStart(sf)).line + 1;
              if (warningLines.has(line)) {
                const list = node.parent;
                const stmt = list && list.parent;
                if (!ts.isVariableDeclarationList(list) || !ts.isVariableStatement(stmt)) {
                  throw new Error(`response warning at line ${line} is not a simple variable statement`);
                }
                if (list.declarations.length !== 1 || !node.initializer || !ts.isAwaitExpression(node.initializer)) {
                  throw new Error(`response warning at line ${line} is not a single awaited binding`);
                }
                edits.push({ start: stmt.getStart(sf), end: stmt.getEnd(), text: `${node.initializer.getText(sf)};` });
              }
            }
            ts.forEachChild(node, visit);
          }
          visit(sf);
          if (edits.length !== 6) {
            throw new Error(`expected 6 AST edits, found ${edits.length}`);
          }
          let out = source;
          for (const edit of edits.sort((a, b) => b.start - a.start)) {
            out = out.slice(0, edit.start) + edit.text + out.slice(edit.end);
          }
          fs.writeFileSync(target, out);
          NODE
          npx prettier --write "$target"
          npx eslint "$target" -f json > /tmp/finals-eslint-after.json
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/finals-eslint-after.json', 'utf8'));
          const remaining = report[0].messages.filter(
            (m) => m.ruleId === '@typescript-eslint/no-unused-vars' && /'response'/.test(m.message),
          );
          if (remaining.length !== 0) {
            throw new Error(`unused response warnings remain: ${remaining.length}`);
          }
          NODE
          npx jest "$target" --runInBand
      - name: Remove temporary workflow and commit cleanup
        run: |
          git rm .github/workflows/automation-3460-finals-response-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smkc-score-app/__tests__/lib/api-factories/finals-route.test.ts
          git diff --cached --check
          git commit -m "test: drop unused finals response bindings"
          git push origin HEAD:automation/3460-finals-response-cleanup-20260915
