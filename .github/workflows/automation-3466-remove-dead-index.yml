name: Automation 3466 remove dead index

on:
  push:
    branches: [automation/3460-unused-cleanup-20260915]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/3460-unused-cleanup-20260915
      - name: Remove dead increment and temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("smkc-score-app/src/lib/api-factories/qualification-route.ts")
          s = p.read_text()
          old = "          if (!autoCompleteBye) {\n            matchSequenceIndex++;\n          }\n\n"
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, ""))
          PY
          git rm .github/workflows/automation-3466-remove-dead-index.yml
          git rm .github/workflows/automation-3466-restore.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smkc-score-app/src/lib/api-factories/qualification-route.ts
          git diff --cached --check
          git commit -m "fix: remove dead qualification match index increment"
          git push origin HEAD:automation/3460-unused-cleanup-20260915
