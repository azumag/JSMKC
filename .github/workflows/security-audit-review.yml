name: Security audit review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Review dependency audit exception
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: smkc-score-app

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: smkc-score-app/package-lock.json

      - name: Pin npm
        run: |
          npm install --global npm@10.9.4
          test "$(npm --version)" = "10.9.4"

      - name: Install dependencies
        run: npm ci

      - name: Review #3114 security audit exception
        run: node scripts/security-audit-lockfile.js && node scripts/security-audit-status.js && node scripts/security-audit.js
