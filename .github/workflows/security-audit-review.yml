name: Security audit review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Review dependency audit exception
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: smkc-score-app

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: smkc-score-app/package-lock.json

      - name: Pin npm
        run: |
          npm install --global npm@10.9.4
          test "$(npm --version)" = "10.9.4"

      - name: Install dependencies
        run: npm ci

      - id: lockfile_preflight
        name: Validate security audit lockfile
        run: node scripts/security-audit-lockfile.js

      - id: exception_status
        name: "Review #3114 exception status"
        run: node scripts/security-audit-status.js

      - id: canonical_audit
        name: Run canonical security audit
        if: ${{ always() && steps.lockfile_preflight.outcome == 'success' }}
        run: node scripts/security-audit.js

      - name: "Summarize #3114 review evidence"
        if: always()
        env:
          LOCKFILE_PREFLIGHT_OUTCOME: ${{ steps.lockfile_preflight.outcome }}
          EXCEPTION_STATUS_OUTCOME: ${{ steps.exception_status.outcome }}
          EXCEPTION_STATUS_STATE: ${{ steps.exception_status.outputs.state }}
          EXCEPTION_REVIEW_DEADLINE: ${{ steps.exception_status.outputs.deadline }}
          CANONICAL_AUDIT_OUTCOME: ${{ steps.canonical_audit.outcome }}
        run: |
          {
            echo "## #3114 security audit review"
            echo
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| Lockfile preflight | \`${LOCKFILE_PREFLIGHT_OUTCOME}\` |"
            echo "| Temporary exception status | \`${EXCEPTION_STATUS_OUTCOME}\` |"
            echo "| Canonical npm audit | \`${CANONICAL_AUDIT_OUTCOME}\` |"
            echo
            echo "Temporary exception state: \`${EXCEPTION_STATUS_STATE:-unavailable}\`"
            echo
            echo "Review deadline: \`${EXCEPTION_REVIEW_DEADLINE:-unavailable}\`"
            echo
            echo "The review workflow is read-only and does not modify, extend, or remove the #3114 exception."
          } >> "$GITHUB_STEP_SUMMARY"
