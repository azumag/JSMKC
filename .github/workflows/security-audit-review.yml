name: Security audit review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Review dependency audit exception
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: smkc-score-app

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Pin npm
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.4
          test "$(npm --version)" = "10.9.4"

      - id: lockfile_preflight
        name: Validate security audit lockfile
        run: node scripts/security-audit-lockfile.js

      - id: exception_status
        name: "Review #3114 exception status"
        run: node scripts/security-audit-status.js

      - id: canonical_audit
        name: Run canonical security audit
        if: ${{ always() && steps.lockfile_preflight.outcome == 'success' }}
        run: node scripts/security-audit.js

      - id: compatible_upstream
        name: Check latest compatible Prisma release
        if: always()
        run: node scripts/security-audit-upstream.js

      - id: compatible_upstream_timestamp
        name: Timestamp compatible upstream evidence
        if: always()
        run: echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - id: next_major_upstream
        name: Check next-major Prisma remediation
        if: always()
        continue-on-error: true
        run: node scripts/security-audit-next-major.js

      - id: next_major_upstream_timestamp
        name: Timestamp next-major upstream evidence
        if: always()
        run: echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - id: prisma_v7_readiness
        name: Inspect Prisma 7 migration readiness
        if: always()
        continue-on-error: true
        run: node scripts/prisma-v7-readiness.cjs

      - id: prisma_v7_typescript_prereqs
        name: Inspect Prisma 7 TypeScript prerequisites
        if: always()
        continue-on-error: true
        run: node scripts/prisma-v7-typescript-prereqs.cjs

      - id: prisma_v7_env_loading
        name: Inspect Prisma 7 environment loading
        if: always()
        continue-on-error: true
        run: node scripts/prisma-v7-env-loading.cjs

      - id: prisma_v7_removed_surfaces
        name: Inspect Prisma 7 removed surfaces
        if: always()
        continue-on-error: true
        run: node scripts/prisma-v7-removed-surfaces.cjs

      - id: prisma_v7_support_surface
        name: Inspect Prisma 7 support-code migration surface
        if: always()
        continue-on-error: true
        run: node scripts/prisma-v7-support-surface.cjs

      - id: prisma_v7_esm_surface
        name: Inspect Prisma 7 ESM migration surface
        if: always()
        continue-on-error: true
        run: node scripts/prisma-v7-esm-surface.cjs

      - name: "Summarize #3114 review evidence"
        if: always()
        env:
          REVIEW_REF: ${{ github.ref }}
          REVIEW_SHA: ${{ github.sha }}
          LOCKFILE_PREFLIGHT_OUTCOME: ${{ steps.lockfile_preflight.outcome }}
          EXCEPTION_STATUS_OUTCOME: ${{ steps.exception_status.outcome }}
          EXCEPTION_STATUS_STATE: ${{ steps.exception_status.outputs.state }}
          EXCEPTION_TRACKING_ISSUE: ${{ steps.exception_status.outputs.tracking_issue }}
          EXCEPTION_ADVISORY: ${{ steps.exception_status.outputs.advisory }}
          EXCEPTION_ADVISORY_RANGE: ${{ steps.exception_status.outputs.advisory_range }}
          EXCEPTION_CHECKED_AT: ${{ steps.exception_status.outputs.checked_at }}
          EXCEPTION_REVIEW_DEADLINE: ${{ steps.exception_status.outputs.deadline }}
          EXCEPTION_DAYS_UNTIL_DEADLINE: ${{ steps.exception_status.outputs.days_until_deadline }}
          PRISMA_VERSION: ${{ steps.exception_status.outputs.prisma_version }}
          PRISMA_CONFIG_VERSION: ${{ steps.exception_status.outputs.prisma_config_version }}
          PRISMA_CONFIG_DEEPMERGE_REQUIREMENT: ${{ steps.exception_status.outputs.prisma_config_deepmerge_requirement }}
          DEEPMERGE_TS_VERSION: ${{ steps.exception_status.outputs.deepmerge_ts_version }}
          CANONICAL_AUDIT_OUTCOME: ${{ steps.canonical_audit.outcome }}
          COMPATIBLE_UPSTREAM_OUTCOME: ${{ steps.compatible_upstream.outcome }}
          COMPATIBLE_UPSTREAM_STATE: ${{ steps.compatible_upstream.outputs.state }}
          COMPATIBLE_UPSTREAM_REGISTRY: ${{ steps.compatible_upstream.outputs.registry }}
          PRISMA_SELECTOR: ${{ steps.compatible_upstream.outputs.prisma_selector }}
          LATEST_COMPATIBLE_PRISMA_VERSION: ${{ steps.compatible_upstream.outputs.latest_compatible_prisma_version }}
          PRISMA_CONFIG_SELECTOR: ${{ steps.compatible_upstream.outputs.prisma_config_selector }}
          LATEST_COMPATIBLE_PRISMA_CONFIG_VERSION: ${{ steps.compatible_upstream.outputs.latest_compatible_prisma_config_version }}
          LATEST_COMPATIBLE_DEEPMERGE_REQUIREMENT: ${{ steps.compatible_upstream.outputs.prisma_config_deepmerge_requirement }}
          COMPATIBLE_PUBLISHED_REMEDIATION_CANDIDATE: ${{ steps.compatible_upstream.outputs.published_remediation_candidate }}
          COMPATIBLE_PUBLISHED_PACKAGE_SET_STATE: ${{ steps.compatible_upstream.outputs.published_remediation_package_set_state }}
          COMPATIBLE_PUBLISHED_PRISMA_CLIENT_SELECTOR: ${{ steps.compatible_upstream.outputs.published_remediation_prisma_client_selector }}
          COMPATIBLE_PUBLISHED_PRISMA_CLIENT_VERSION: ${{ steps.compatible_upstream.outputs.published_remediation_prisma_client_version }}
          COMPATIBLE_PUBLISHED_ADAPTER_D1_SELECTOR: ${{ steps.compatible_upstream.outputs.published_remediation_adapter_d1_selector }}
          COMPATIBLE_PUBLISHED_ADAPTER_D1_VERSION: ${{ steps.compatible_upstream.outputs.published_remediation_adapter_d1_version }}
          NEXT_MAJOR_UPSTREAM_OUTCOME: ${{ steps.next_major_upstream.outcome }}
          NEXT_MAJOR_UPSTREAM_STATE: ${{ steps.next_major_upstream.outputs.state }}
          NEXT_MAJOR_UPSTREAM_REGISTRY: ${{ steps.next_major_upstream.outputs.registry }}
          NEXT_MAJOR_CURRENT_PRISMA_SELECTOR: ${{ steps.next_major_upstream.outputs.current_prisma_selector }}
          NEXT_MAJOR_PRISMA_SELECTOR: ${{ steps.next_major_upstream.outputs.prisma_selector }}
          LATEST_NEXT_MAJOR_PRISMA_VERSION: ${{ steps.next_major_upstream.outputs.latest_compatible_prisma_version }}
          NEXT_MAJOR_PRISMA_CONFIG_SELECTOR: ${{ steps.next_major_upstream.outputs.prisma_config_selector }}
          LATEST_NEXT_MAJOR_PRISMA_CONFIG_VERSION: ${{ steps.next_major_upstream.outputs.latest_compatible_prisma_config_version }}
          NEXT_MAJOR_DEEPMERGE_REQUIREMENT: ${{ steps.next_major_upstream.outputs.prisma_config_deepmerge_requirement }}
          NEXT_MAJOR_PUBLISHED_REMEDIATION_CANDIDATE: ${{ steps.next_major_upstream.outputs.published_remediation_candidate }}
          NEXT_MAJOR_PUBLISHED_PACKAGE_SET_STATE: ${{ steps.next_major_upstream.outputs.published_remediation_package_set_state }}
          NEXT_MAJOR_PUBLISHED_PRISMA_CLIENT_VERSION: ${{ steps.next_major_upstream.outputs.published_remediation_prisma_client_version }}
          NEXT_MAJOR_PUBLISHED_ADAPTER_D1_VERSION: ${{ steps.next_major_upstream.outputs.published_remediation_adapter_d1_version }}
          PRISMA_V7_READINESS_OUTCOME: ${{ steps.prisma_v7_readiness.outcome }}
          PRISMA_V7_SUPPORT_SURFACE_OUTCOME: ${{ steps.prisma_v7_support_surface.outcome }}
          PRISMA_V7_ESM_SURFACE_OUTCOME: ${{ steps.prisma_v7_esm_surface.outcome }}
        run: |
          {
            echo "## #3114 security audit review"
            echo
            echo "Review ref: \`${REVIEW_REF:-unavailable}\`"
            echo
            echo "Review commit: \`${REVIEW_SHA:-unavailable}\`"
            echo
            echo "Compatible upstream checked at: \`${{ steps.compatible_upstream_timestamp.outputs.checked_at }}\`"
            echo
            echo "Next-major upstream checked at: \`${{ steps.next_major_upstream_timestamp.outputs.checked_at }}\`"
            echo
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| Lockfile preflight | \`${LOCKFILE_PREFLIGHT_OUTCOME}\` |"
            echo "| Temporary exception status | \`${EXCEPTION_STATUS_OUTCOME}\` |"
            echo "| Canonical npm audit | \`${CANONICAL_AUDIT_OUTCOME}\` |"
            echo "| Compatible Prisma release probe | \`${COMPATIBLE_UPSTREAM_OUTCOME}\` |"
            echo "| Next-major Prisma remediation probe | \`${NEXT_MAJOR_UPSTREAM_OUTCOME}\` |"
            echo "| Prisma 7 migration readiness probe | \`${PRISMA_V7_READINESS_OUTCOME}\` |"
            echo "| Prisma 7 TypeScript prerequisite probe | \`${{ steps.prisma_v7_typescript_prereqs.outcome }}\` |"
            echo "| Prisma 7 environment loading probe | \`${{ steps.prisma_v7_env_loading.outcome }}\` |"
            echo "| Prisma 7 removed-surface probe | \`${{ steps.prisma_v7_removed_surfaces.outcome }}\` |"
            echo "| Prisma 7 support-code surface probe | \`${PRISMA_V7_SUPPORT_SURFACE_OUTCOME}\` |"
            echo "| Prisma 7 ESM surface probe | \`${PRISMA_V7_ESM_SURFACE_OUTCOME}\` |"
            echo
            echo "Tracking issue: \`#${EXCEPTION_TRACKING_ISSUE:-unavailable}\`"
            echo
            echo "Tracked advisory: \`${EXCEPTION_ADVISORY:-unavailable}\` (\`${EXCEPTION_ADVISORY_RANGE:-unavailable}\`)"
            echo
            echo "Temporary exception state: \`${EXCEPTION_STATUS_STATE:-unavailable}\`"
            echo
            echo "Status checked at: \`${EXCEPTION_CHECKED_AT:-unavailable}\`"
            echo
            echo "Review deadline: \`${EXCEPTION_REVIEW_DEADLINE:-unavailable}\`"
            echo
            echo "Days until review deadline: \`${EXCEPTION_DAYS_UNTIL_DEADLINE:-unavailable}\`"
            echo
            echo "| Tracked evidence | Value |"
            echo "| --- | --- |"
            echo "| prisma installed version | \`${PRISMA_VERSION:-unavailable}\` |"
            echo "| @prisma/config installed version | \`${PRISMA_CONFIG_VERSION:-unavailable}\` |"
            echo "| @prisma/config → deepmerge-ts requirement | \`${PRISMA_CONFIG_DEEPMERGE_REQUIREMENT:-unavailable}\` |"
            echo "| deepmerge-ts installed version | \`${DEEPMERGE_TS_VERSION:-unavailable}\` |"
            echo
            echo "| Latest compatible upstream evidence | Value |"
            echo "| --- | --- |"
            echo "| Probe state | \`${COMPATIBLE_UPSTREAM_STATE:-unavailable}\` |"
            echo "| Registry | \`${COMPATIBLE_UPSTREAM_REGISTRY:-unavailable}\` |"
            echo "| Manifest prisma selector | \`${PRISMA_SELECTOR:-unavailable}\` |"
            echo "| Latest compatible prisma | \`${LATEST_COMPATIBLE_PRISMA_VERSION:-unavailable}\` |"
            echo "| prisma → @prisma/config selector | \`${PRISMA_CONFIG_SELECTOR:-unavailable}\` |"
            echo "| Latest compatible @prisma/config | \`${LATEST_COMPATIBLE_PRISMA_CONFIG_VERSION:-unavailable}\` |"
            echo "| Compatible @prisma/config → deepmerge-ts requirement | \`${LATEST_COMPATIBLE_DEEPMERGE_REQUIREMENT:-unavailable}\` |"
            echo "| Published remediation candidate | \`${COMPATIBLE_PUBLISHED_REMEDIATION_CANDIDATE:-unavailable}\` |"
            echo "| Published remediation package set | \`${COMPATIBLE_PUBLISHED_PACKAGE_SET_STATE:-unavailable}\` |"
            echo "| Manifest @prisma/client selector | \`${COMPATIBLE_PUBLISHED_PRISMA_CLIENT_SELECTOR:-unavailable}\` |"
            echo "| Latest manifest-compatible @prisma/client | \`${COMPATIBLE_PUBLISHED_PRISMA_CLIENT_VERSION:-unavailable}\` |"
            echo "| Manifest @prisma/adapter-d1 selector | \`${COMPATIBLE_PUBLISHED_ADAPTER_D1_SELECTOR:-unavailable}\` |"
            echo "| Latest manifest-compatible @prisma/adapter-d1 | \`${COMPATIBLE_PUBLISHED_ADAPTER_D1_VERSION:-unavailable}\` |"
            echo
            echo "| Next-major remediation evidence (advisory only) | Value |"
            echo "| --- | --- |"
            echo "| Probe state | \`${NEXT_MAJOR_UPSTREAM_STATE:-unavailable}\` |"
            echo "| Registry | \`${NEXT_MAJOR_UPSTREAM_REGISTRY:-unavailable}\` |"
            echo "| Current manifest prisma selector | \`${NEXT_MAJOR_CURRENT_PRISMA_SELECTOR:-unavailable}\` |"
            echo "| Probed next-major prisma selector | \`${NEXT_MAJOR_PRISMA_SELECTOR:-unavailable}\` |"
            echo "| Latest next-major prisma | \`${LATEST_NEXT_MAJOR_PRISMA_VERSION:-unavailable}\` |"
            echo "| prisma → @prisma/config selector | \`${NEXT_MAJOR_PRISMA_CONFIG_SELECTOR:-unavailable}\` |"
            echo "| Latest next-major @prisma/config | \`${LATEST_NEXT_MAJOR_PRISMA_CONFIG_VERSION:-unavailable}\` |"
            echo "| Next-major @prisma/config → deepmerge-ts requirement | \`${NEXT_MAJOR_DEEPMERGE_REQUIREMENT:-unavailable}\` |"
            echo "| Published remediation candidate | \`${NEXT_MAJOR_PUBLISHED_REMEDIATION_CANDIDATE:-unavailable}\` |"
            echo "| Published remediation package set | \`${NEXT_MAJOR_PUBLISHED_PACKAGE_SET_STATE:-unavailable}\` |"
            echo "| Candidate @prisma/client | \`${NEXT_MAJOR_PUBLISHED_PRISMA_CLIENT_VERSION:-unavailable}\` |"
            echo "| Candidate @prisma/adapter-d1 | \`${NEXT_MAJOR_PUBLISHED_ADAPTER_D1_VERSION:-unavailable}\` |"
            echo
            echo "Next-major, Prisma 7 readiness, Prisma 7 environment-loading, Prisma 7 removed-surface, Prisma 7 support-code, and Prisma 7 ESM migration evidence are advisory only; a Prisma major upgrade requires an explicit dependency migration PR and full compatibility validation."
            echo
            echo "Prisma 7 TypeScript prerequisite evidence is advisory only and can use package-lock evidence when dependencies are not installed by this read-only review workflow."
            echo
            echo "The review workflow is read-only and does not modify, extend, or remove the #3114 exception."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize probe reason evidence
        if: always()
        env:
          EXCEPTION_STATUS_REASON: ${{ steps.exception_status.outputs.reason }}
          COMPATIBLE_PACKAGE_SET_REASON: ${{ steps.compatible_upstream.outputs.published_remediation_package_set_reason }}
          NEXT_MAJOR_PACKAGE_SET_REASON: ${{ steps.next_major_upstream.outputs.published_remediation_package_set_reason }}
          NEXT_MAJOR_PRISMA_CLIENT_SELECTOR: ${{ steps.next_major_upstream.outputs.published_remediation_prisma_client_selector }}
          NEXT_MAJOR_ADAPTER_D1_SELECTOR: ${{ steps.next_major_upstream.outputs.published_remediation_adapter_d1_selector }}
        run: |
          {
            echo
            echo "### Probe reason and selector diagnostics"
            echo
            echo "| Evidence | Value |"
            echo "| --- | --- |"
            echo "| Temporary exception reason | \`${EXCEPTION_STATUS_REASON:-none}\` |"
            echo "| Compatible package-set reason | \`${COMPATIBLE_PACKAGE_SET_REASON:-unavailable}\` |"
            echo "| Next-major package-set reason | \`${NEXT_MAJOR_PACKAGE_SET_REASON:-unavailable}\` |"
            echo "| Next-major @prisma/client selector | \`${NEXT_MAJOR_PRISMA_CLIENT_SELECTOR:-unavailable}\` |"
            echo "| Next-major @prisma/adapter-d1 selector | \`${NEXT_MAJOR_ADAPTER_D1_SELECTOR:-unavailable}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: compatible_upstream_gate
        name: Require explicit follow-up for compatible remediation
        if: always()
        env:
          COMPATIBLE_UPSTREAM_OUTCOME: ${{ steps.compatible_upstream.outcome }}
          COMPATIBLE_UPSTREAM_STATE: ${{ steps.compatible_upstream.outputs.state }}
        run: |
          if [ "$COMPATIBLE_UPSTREAM_OUTCOME" != "success" ]; then
            echo "Compatible upstream probe did not complete successfully; review the evidence above." >&2
            exit 1
          fi

          compatible_candidate="${{ steps.compatible_upstream.outputs.published_remediation_candidate }}"
          compatible_package_set_state="${{ steps.compatible_upstream.outputs.published_remediation_package_set_state }}"
          compatible_client_selector="${{ steps.compatible_upstream.outputs.published_remediation_prisma_client_selector }}"
          compatible_client="${{ steps.compatible_upstream.outputs.published_remediation_prisma_client_version }}"
          compatible_adapter_selector="${{ steps.compatible_upstream.outputs.published_remediation_adapter_d1_selector }}"
          compatible_adapter="${{ steps.compatible_upstream.outputs.published_remediation_adapter_d1_version }}"

          if [ "$COMPATIBLE_UPSTREAM_STATE" = "compatible-forward-remediation-available" ]; then
            if [ "$compatible_candidate" != "none" ] && [ "$compatible_package_set_state" = "ready" ]; then
              echo "A complete compatible stable Prisma remediation package set is available; validate it in an explicit dependency update PR before keeping #3114 active." >&2
              exit 1
            fi

            if [ "$compatible_candidate" = "none" ] && [ "$compatible_package_set_state" = "incomplete" ]; then
              echo "A compatible Prisma CLI/config remediation exists, but @prisma/client selector ${compatible_client_selector:-unavailable} resolves latest ${compatible_client:-unavailable} without the CLI candidate; @prisma/adapter-d1 selector ${compatible_adapter_selector:-unavailable} resolves latest ${compatible_adapter:-unavailable}. Keep #3114 active and review again later." >&2
              exit 0
            fi

            echo "Compatible remediation evidence is unavailable or inconsistent; @prisma/client selector=${compatible_client_selector:-unavailable}, version=${compatible_client:-unavailable}; @prisma/adapter-d1 selector=${compatible_adapter_selector:-unavailable}, version=${compatible_adapter:-unavailable}. Review the package-set evidence above before changing #3114." >&2
            exit 1
          fi

          if [ "$COMPATIBLE_UPSTREAM_STATE" != "compatible-release-still-vulnerable" ]; then
            echo "Unexpected compatible upstream state: ${COMPATIBLE_UPSTREAM_STATE:-unavailable}" >&2
            exit 1
          fi
