name: Prisma defineConfig format fix

on:
  pull_request:
    paths:
      - 'smkc-score-app/scripts/prisma-v7-defineconfig-alias-guard.cjs'
      - 'smkc-score-app/__tests__/scripts/prisma-v7-defineconfig-alias-guard.test.ts'
      - 'smkc-score-app/docs/prisma-v7-defineconfig-alias-guard.md'
      - '.github/workflows/prisma-defineconfig-format-fix.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smkc-score-app/package-lock.json
      - name: Install dependencies
        working-directory: smkc-score-app
        run: npm ci --ignore-scripts
      - name: Format files
        working-directory: smkc-score-app
        run: npx prettier --write scripts/prisma-v7-defineconfig-alias-guard.cjs __tests__/scripts/prisma-v7-defineconfig-alias-guard.test.ts docs/prisma-v7-defineconfig-alias-guard.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smkc-score-app/scripts/prisma-v7-defineconfig-alias-guard.cjs smkc-score-app/__tests__/scripts/prisma-v7-defineconfig-alias-guard.test.ts smkc-score-app/docs/prisma-v7-defineconfig-alias-guard.md
          git commit -m 'style: format Prisma defineConfig alias guard'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
