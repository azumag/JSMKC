name: Automation 3468 lint rationale

on:
  push:
    branches:
      - automation/3468-lint-rationale-20260915

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/3468-lint-rationale-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smkc-score-app/package-lock.json
      - name: Document intentional Next.js lint exceptions
        run: |
          python - <<'PY'
          from pathlib import Path

          overlay = Path('smkc-score-app/src/app/tournaments/[id]/overlay/dashboard/page.tsx')
          text = overlay.read_text()
          old = ' */\n\n"use client";'
          new = ' */\n\n/* eslint-disable @next/next/no-img-element -- OBS overlay uses a local static no-camera asset at exact broadcast-scene pixels; keep direct loading to avoid image-optimizer transformations and provider usage/cost. */\n"use client";'
          if text.count(old) != 1:
              raise SystemExit(f'overlay anchor count: {text.count(old)}')
          overlay.write_text(text.replace(old, new))

          setup = Path('smkc-score-app/src/app/tournaments/[id]/ta/battle-royale-setup-client.tsx')
          text = setup.read_text()
          old = '      window.location.assign(`/tournaments/${tournamentId}/ta/finals`);'
          new = '''      // A hard reload is intentional here: the POST creates tournament finals state, and the\n      // destination must bootstrap from fresh server state rather than a prefetched App Router tree.\n      // eslint-disable-next-line @next/next/no-location-assign-relative-destination\n      window.location.assign(`/tournaments/${tournamentId}/ta/finals`);'''
          if text.count(old) != 1:
              raise SystemExit(f'navigation anchor count: {text.count(old)}')
          setup.write_text(text.replace(old, new))
          PY
      - name: Validate lint and formatting
        working-directory: smkc-score-app
        run: |
          npm ci --ignore-scripts
          npx prettier --write 'src/app/tournaments/[id]/overlay/dashboard/page.tsx' 'src/app/tournaments/[id]/ta/battle-royale-setup-client.tsx'
          npx eslint 'src/app/tournaments/[id]/overlay/dashboard/page.tsx' 'src/app/tournaments/[id]/ta/battle-royale-setup-client.tsx' --max-warnings=0
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/automation-3468-lint-rationale.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'smkc-score-app/src/app/tournaments/[id]/overlay/dashboard/page.tsx' 'smkc-score-app/src/app/tournaments/[id]/ta/battle-royale-setup-client.tsx'
          git diff --cached --check
          git commit -m "chore: document intentional Next.js lint exceptions"
          git push origin HEAD:automation/3468-lint-rationale-20260915
