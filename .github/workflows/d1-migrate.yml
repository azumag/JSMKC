name: D1 Migrate

on:
  # Auto-apply whenever a migration file lands on main. This workflow was
  # briefly push-triggered (#718, after migration 0027 shipped unapplied and
  # broke prod), then narrowed to workflow_dispatch-only two days later (#815)
  # on the assumption that Cloudflare Workers Builds runs `npm run deploy:cf`
  # (which chains `db:migrations:apply` before `wrangler deploy`) on every
  # merge to main. That assumption was never actually true: Workers Builds'
  # dashboard-configured build command does not run migrations, so every
  # migration since #815 has only ever been applied via manual
  # workflow_dispatch catch-up runs (#3017's 0042/0043 being the latest
  # example — both sat unapplied on production until a manual replay).
  # Keep workflow_dispatch too, for ad hoc/emergency replays.
  push:
    branches: [main]
    paths:
      - "smkc-score-app/migrations/**"
      - ".github/workflows/d1-migrate.yml"
  workflow_dispatch:

env:
  CF_PARITY_VERSION: 1.0.0-beta.24

concurrency:
  group: d1-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply D1 migrations (remote)
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: smkc-score-app

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.23.4"
          cache: "npm"
          cache-dependency-path: smkc-score-app/package-lock.json

      - name: Pin npm
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.4
          test "$(npm --version)" = "10.9.4"

      - name: Install dependencies
        run: npm ci
        env:
          # Production migration validation never needs local Git hooks; keep install parity with CI.
          HUSKY: "0"

      - name: Install pinned cf CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund "cf@${CF_PARITY_VERSION}"

      - name: Verify cf D1 command surface
        run: node scripts/cloudflare-cf-parity.cjs

      - name: List pending migrations
        run: npm run db:migrations:list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migrations
        run: npm run db:migrations:apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirm no migrations remain pending (audit log)
        # The operational list command is cf-first since #4201 Phase C; the
        # audit still parses through the repository-owned fail-closed
        # boundary, which accepts both cf's empty JSON list (`[]`) and
        # Wrangler's text sentinel so a Wrangler fallback stays readable.
        # stdout only: the wrapper writes cf JSON to stdout and diagnostics
        # to stderr, so capturing 2>&1 would pollute the parsed contract.
        run: |
          set -euo pipefail
          output="$(npm run db:migrations:list)"
          printf '%s\n' "${output}"
          printf '%s\n' "${output}" | node scripts/d1-migration-audit.cjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
