name: E2E Nightly (TA Battle Royale)

on:
  # Nightly regression against the preview environment (#2871 / #2889).
  # Requires: a Cloudflare preview deployment at E2E_BASE_URL and a
  # Playwright persistent profile with an authenticated admin session
  # (E2E_PROFILE_DIR). Preview deploys happen via Cloudflare Workers Builds,
  # not GitHub Actions, so this workflow waits for the deployed worker to
  # respond before starting.
  schedule:
    - cron: "30 20 * * *" # 05:30 JST daily
  workflow_dispatch:
    inputs:
      e2e_suite:
        description: "E2E suite to run (tc-ta-battle-royale or tc-all)"
        required: false
        default: "tc-ta-battle-royale"
        type: choice
        options:
          - tc-ta-battle-royale
          - tc-all

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  profile_preflight:
    name: Check admin browser profile prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      profile_available: ${{ steps.profile.outputs.available }}
    steps:
      - id: profile
        name: Validate admin browser profile secret
        env:
          PROFILE_ARCHIVE: ${{ secrets.E2E_PROFILE_ARCHIVE }}
        run: |
          if [ -z "${PROFILE_ARCHIVE}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
              echo "::notice::E2E_PROFILE_ARCHIVE is not configured; skipping scheduled nightly E2E until an authenticated admin profile is configured."
              echo "available=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "::error::E2E_PROFILE_ARCHIVE is not configured; manually dispatched E2E requires an authenticated admin profile."
            exit 1
          fi

          echo "available=true" >> "${GITHUB_OUTPUT}"

  e2e:
    name: TA Battle Royale E2E (preview)
    needs: profile_preflight
    if: needs.profile_preflight.outputs.profile_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://preview.smkc.bluemoon.works' }}
      E2E_BROWSER_HOME: /tmp/playwright-e2e-home
      # Persistent admin profile: CI uploads one via E2E_PROFILE_ARCHIVE; the
      # runner restores it before launching Playwright.
      E2E_PROFILE_DIR: /tmp/playwright-smkc-preview-profile

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: smkc-score-app/package-lock.json

      - name: Pin npm
        working-directory: smkc-score-app
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@10.9.4
          test "$(npm --version)" = "10.9.4"

      - name: Install dependencies
        working-directory: smkc-score-app
        run: npm ci
        env:
          # Nightly validation never needs local Git hooks; keep install parity with CI.
          HUSKY: "0"

      # The E2E runtime intentionally stores Playwright browsers under
      # E2E_BROWSER_HOME rather than Playwright's default ~/.cache directory.
      # Restore only the exact lockfile key so an older browser revision cannot
      # satisfy a newer Playwright package by accident.
      - id: playwright-browser-cache
        name: Restore Playwright browser cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/playwright-e2e-home/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('smkc-score-app/package-lock.json') }}

      - name: Ensure Playwright browser is installed
        working-directory: smkc-score-app
        run: npm run e2e:install-browser

      # Save immediately after installation instead of relying on a post-job
      # cache hook. The E2E suite can legitimately fail later (for example when
      # an admin profile expires); that should not force the next run to fetch
      # hundreds of MB of browser binaries again.
      - name: Save Playwright browser cache
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/playwright-e2e-home/ms-playwright
          key: ${{ steps.playwright-browser-cache.outputs.cache-primary-key }}

      - name: Restore admin browser profile
        # The profile contains authenticated admin session material. Build it
        # locally with `npm run e2e:preview:login`, then store its base64 archive
        # only in E2E_PROFILE_ARCHIVE. For a macOS/Linux-portable encoder, use:
        # cd /tmp && umask 077 && tar -czf profile.tar.gz playwright-smkc-preview-profile
        # node -e "process.stdout.write(require('fs').readFileSync('profile.tar.gz').toString('base64'))" > profile.base64
        # Remove both temporary files after updating the secret; see docs/e2e-nightly.md.
        env:
          PROFILE_ARCHIVE: ${{ secrets.E2E_PROFILE_ARCHIVE }}
        run: |
          umask 077
          ARCHIVE_PATH="/tmp/e2e-profile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          cleanup_profile_archive() {
            rm -f "${ARCHIVE_PATH}"
          }
          trap cleanup_profile_archive EXIT

          printf '%s' "${PROFILE_ARCHIVE}" | base64 -d > "${ARCHIVE_PATH}"

          if ! ARCHIVE_ENTRIES="$(tar -tzf "${ARCHIVE_PATH}")"; then
            echo "::error::E2E_PROFILE_ARCHIVE is not a readable gzip tar archive."
            exit 1
          fi
          if [ -z "${ARCHIVE_ENTRIES}" ]; then
            echo "::error::E2E_PROFILE_ARCHIVE is empty; refusing to extract it."
            exit 1
          fi

          PROFILE_ROOT="${E2E_PROFILE_DIR##*/}"
          if ! printf '%s\n' "${ARCHIVE_ENTRIES}" | awk -v root="${PROFILE_ROOT}" '
            {
              path = $0
              if (path == "" || path ~ /^\//) exit 1
              count = split(path, parts, "/")
              for (i = 1; i <= count; i++) {
                if (parts[i] == "..") exit 1
              }
              if (path != root && index(path, root "/") != 1) exit 1
            }
          '; then
            echo "::error::E2E_PROFILE_ARCHIVE contains entries outside ${PROFILE_ROOT}; refusing to extract it."
            exit 1
          fi

          if ! tar -tvzf "${ARCHIVE_PATH}" | awk '
            {
              type = substr($1, 1, 1)
              if (type != "-" && type != "d") exit 1
            }
          '; then
            echo "::error::E2E_PROFILE_ARCHIVE contains symlink, hardlink, or special entries; only regular files and directories are allowed."
            exit 1
          fi

          mkdir -p "${E2E_PROFILE_DIR}"
          tar -xzf "${ARCHIVE_PATH}" -C /tmp
          chmod -R go-rwx "${E2E_PROFILE_DIR}"
          echo "Admin profile restored ($(du -sh ${E2E_PROFILE_DIR} | cut -f1))"

      - name: Run E2E suite
        working-directory: smkc-score-app
        run: |
          SUITE="${{ inputs.e2e_suite || 'tc-ta-battle-royale' }}"
          mkdir -p /tmp/e2e-output
          node e2e/run-preview.js "${SUITE}.js" 2>&1 | tee /tmp/e2e-output/console.log
          exit ${PIPESTATUS[0]}

      - name: Upload E2E console log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-log-${{ github.run_id }}
          path: /tmp/e2e-output/console.log
          if-no-files-found: ignore
          retention-days: 14
